<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Binder Slots">
  <meta name="theme-color" content="#e3350d">
  <link rel="apple-touch-icon" sizes="180x180" href="https://e7.pngegg.com/pngimages/324/645/png-clipart-pokeball-pokeball-thumbnail.png">
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg">
  <title>Binder Slot Finder</title>
  <style>
    :root{
      --accent:#e3350d;
      --accent-2:#ffcc00;
      --bg:#fff9f6;
      --fg:#101214;
      --muted:#596273;
      --border:#e7e7e7;
      --shadow:0 6px 18px rgba(0,0,0,.06);
      --wrap:960px;
    }

    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      color:var(--fg);
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(1200px 800px at -15% -20%, rgba(227,53,13,.15), transparent 60%),
        radial-gradient(900px 600px at 115% 10%, rgba(255,204,0,.12), transparent 55%),
        radial-gradient(700px 400px at 50% 120%, rgba(227,53,13,.10), transparent 55%),
        var(--bg);
      overflow-x:hidden;
    }

    /* Lock horizontal scroll on mobile */
    html, body {
      overflow-x: hidden;
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }

    /* On very small screens, let form rows stack to avoid horizontal overflow */
    @media (max-width: 400px) {
      .row > * {
        min-width: 0;
        flex: 1 1 100%;
      }
      .wrap { padding-inline: .25rem; }
    }

    /* repeating small Pokéball pattern drifting */
    .bg-pokeballs{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      opacity:.08;
      background-image:url('https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg');
      background-repeat:repeat;
      background-size:60px 60px;
      background-position:0 0;
      animation:pokeScroll 60s linear infinite;
    }
    @keyframes pokeScroll{
      0%{background-position:0 0;}
      100%{background-position:200px 200px;}
    }
    @media (prefers-reduced-motion:reduce){.bg-pokeballs{animation:none;}}

    header{
      position:sticky;top:0;z-index:5;
      backdrop-filter:blur(6px);
      background:rgba(255,255,255,.75);
      border-bottom:1px solid var(--border);
    }
    .wrap{max-width:var(--wrap);margin:0 auto;padding:.5rem;}
    .tabs{display:flex;gap:.6rem;padding:.25rem;}
    .tab-btn{
      flex:1;padding:.85rem 1rem;border:1px solid var(--border);
      background:#fff;cursor:pointer;border-radius:12px;font-weight:700;
      box-shadow:var(--shadow);
      transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
    }
    .tab-btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.08);}
    .tab-btn.active{
      background:linear-gradient(180deg,var(--accent),#c82300);
      color:#fff;border-color:transparent;
      box-shadow:0 10px 24px rgba(227,53,13,.25);
    }

    main{position:relative;z-index:1;}
    .card{
      background:#fff;
      padding:1rem;
      border-radius:16px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
      overflow:hidden; /* keeps children inside rounded corners */
    }
    .hero{max-width:var(--wrap);margin:1rem auto 0;padding:clamp(.5rem,2vw,1rem);position:relative;}
    .hero::before,.hero::after{
      content:"";position:absolute;z-index:0;filter:blur(22px);opacity:.18;pointer-events:none;
    }
    .hero::before{width:280px;height:280px;left:-80px;top:-40px;background:radial-gradient(circle at 30% 30%,var(--accent),transparent 60%);transform:rotate(-8deg);}
    .hero::after{width:260px;height:260px;right:-70px;bottom:-70px;background:radial-gradient(circle at 70% 70%,var(--accent-2),transparent 60%);transform:rotate(10deg);}

    label,input,button,select{font-size:1.05rem;}
    input[type="number"],input[type="text"],select{
      width:100%;padding:.65rem .85rem;margin:.5rem 0 1rem;
      border-radius:12px;border:1px solid var(--border);background:#fff;
    }
    input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;}
    .row{display:flex;gap:.75rem;flex-wrap:wrap;}
    .row>*{flex:1;min-width:220px;}
    .muted{color:var(--muted);}
    button.primary{
      padding:.8rem 1.1rem;border:0;border-radius:12px;cursor:pointer;
      background:linear-gradient(180deg,var(--accent),#c82300);
      color:#fff;font-weight:800;letter-spacing:.2px;
      box-shadow:0 12px 24px rgba(227,53,13,.28);
      transition:transform .12s ease,box-shadow .12s ease;
    }
    button.primary:hover{transform:translateY(-1px);box-shadow:0 16px 30px rgba(227,53,13,.32);}
    button{background:#fff;border:1px solid var(--border);border-radius:12px;padding:.7rem 1rem;cursor:pointer;}
    input[type="checkbox"]{accent-color:var(--accent);}
    .out{margin-top:.75rem;font-weight:700;text-align:center;} /* centered page/slot text */

    [data-tab]{display:none;}
    [data-tab].active{display:block;}

    .toolbar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem;}
    .toolbar .grow{flex:1;min-width:200px;}
    .pill{display:inline-block;padding:.35rem .6rem;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:#fff;}

    /* spacing fix for progress pill */
    #progress{position:relative;top:-3px;margin-right:.4rem;}
    .controls{gap:.6rem;align-items:center;}

    .list{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;}
    .row-item{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;border-bottom:1px solid var(--border);}
    .row-item:last-child{border-bottom:0;}
    .row-item input[type="checkbox"]{transform:scale(1.15);}
    .num{font-variant-numeric:tabular-nums;font-weight:800;width:3.7rem;}
    .name{flex:1;min-width:0;}
    .strike{text-decoration:line-through;color:var(--muted);}
    .filters{display:flex;gap:.4rem;}
    .filters button{padding:.45rem .7rem;border:1px solid var(--border);border-radius:999px;background:#fff;cursor:pointer;}
    .filters button.active{background:var(--accent);color:#fff;border-color:transparent;}

    /* Responsive stats grid that wraps on mobile */
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
      gap:.6rem;
      margin:.6rem 0 1rem;
    }
    .stat{
      border:1px solid var(--border);
      border-radius:12px;
      padding:.6rem .8rem;
      background:linear-gradient(180deg,#ffffff,#fff4f1);
      text-align:center;
      min-width:0;
      box-shadow:var(--shadow);
    }
    .stat .v{font-weight:800;font-size:1.25rem;overflow-wrap:anywhere;}
    .stat .k{color:var(--muted);font-size:.9rem;}
    @media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr);}}

    /* --- SPRITES --- */
    .sprite-box{
      border:1px solid var(--border);
      border-radius:14px;
      width:180px;height:180px;           /* bigger */
      background:#fff;
      display:flex;align-items:center;justify-content:center;
      box-shadow:var(--shadow);
      margin:.25rem auto 0;                /* centered */
    }
    .sprite-box img{max-width:92%;max-height:92%;object-fit:contain;display:block;}
    .icon-sprite{
      width:44px;height:44px;object-fit:contain;display:block;
      background:#fff;border-radius:8px;box-shadow:var(--shadow);
      flex-shrink:0;
    }

    /* --- Finder actions centered --- */
    .finder-actions{
      display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap;margin-top:.25rem;
    }
    .collected-pill{
      display:flex;align-items:center;gap:.5rem;
      padding:.5rem .8rem;border:1px solid var(--border);border-radius:12px;background:#fff;
    }

    /* --- BINDER VIEW (4x4) --- */
    .binder{ margin:.75rem 0 1rem; overflow:hidden; }
    .binder-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:.5rem; }
    .binder-head .title{ font-weight:800; }
    .binder-nav{ display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
    .nav-arrows, .nav-jump{ display:flex; gap:.5rem; align-items:center; }
    .nav-arrows{ white-space:nowrap; }
    .nav-jump input{
      width:4.2rem;padding:.4rem .5rem;border:1px solid var(--border);border-radius:8px;background:#fff;
    }
    .binder-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr)); /* prevents horizontal overflow */
      gap:.5rem;
      width:100%;
    }
    .binder-cell{
      border:1px solid var(--border); border-radius:12px; background:#fff; padding:.45rem; text-align:center;
      display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:120px;
    }
    .binder-cell .slot{ color:var(--muted); font-size:.8rem; margin-top:.25rem; }
    .binder-cell img{ width:64px; height:64px; object-fit:contain; }

    /* Binder cell text sizing + truncation */
    .binder-cell .title{
      font-weight:700;
      margin-top:.25rem;
      font-size:.95rem;
      line-height:1.1;
      max-width:100%;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    @media (max-width: 420px){
      .binder-grid{ gap:.4rem; }
      .binder-cell{ min-height:96px; padding:.4rem; }
      .binder-cell img{ width:56px; height:56px; }
      .binder-cell .title{ font-size:.8rem; }
      .binder-cell .slot{ font-size:.75rem; }
    }

    /* Highlight collected Pokémon in Binder View */
    .binder-cell.checked{
      background:#e9f8ec;               /* soft green */
      border-color:#b8e4c4;
      box-shadow:inset 0 0 0 2px #b8e4c4;
    }
  </style>
</head>
<body>
  <div class="bg-pokeballs" aria-hidden="true"></div>

  <header>
    <div class="wrap">
      <nav class="tabs">
        <button class="tab-btn active" data-open="#finder">Finder</button>
        <button class="tab-btn" data-open="#checklist">Checklist</button>
      </nav>
    </div>
  </header>

  <main class="hero">
    <!-- Finder -->
    <section id="finder" class="card active" data-tab>
      <h1 style="margin:.25rem 0 0.5rem;display:flex;align-items:center;gap:.5rem;">
        <span style="width:.8rem;height:.8rem;border-radius:999px;background:var(--accent);display:inline-block"></span>
        Binder Slot Finder
      </h1>
      <p class="muted">Each side has 16 slots. Enter a number or pick a Pokémon:</p>

      <label for="pokePicker">Search Pokémon</label>
      <input id="pokePicker" list="pokeList" placeholder="e.g. 001 — Bulbasaur" autocomplete="off" />
      <datalist id="pokeList"></datalist>
      <small class="muted">Format in <code>pokemon.txt</code>: <code>Number,Name</code></small>

      <div class="row">
        <div>
          <label for="pokeNum">Card #</label>
          <input id="pokeNum" type="number" min="1" inputmode="numeric" placeholder="e.g. 67" />
        </div>
      </div>

      <!-- Centered actions -->
      <div class="finder-actions">
        <button id="calc" class="primary">Find Slot</button>
        <label class="collected-pill">
          <input type="checkbox" id="collectedToggle" disabled />
          Collected
        </label>
      </div>

      <!-- Selected name + centered larger sprite -->
      <div class="row" style="align-items:center;margin-top:.25rem;">
        <div id="selectedName" class="muted" style="flex:1;text-align:center;"></div>
      </div>
      <div class="finder-sprite-wrap" style="display:flex;justify-content:center;">
        <div id="finderSprite" class="sprite-box"></div>
      </div>

      <div class="out" id="out"></div>
      <div class="out" id="finderHint" style="display:none;color:#b00"></div>
    </section>

    <!-- Checklist -->
    <section id="checklist" class="card" data-tab>
      <h1 style="margin:.25rem 0 .5rem;display:flex;align-items:center;gap:.5rem;">
        <span style="width:.8rem;height:.8rem;border-radius:999px;background:#ffcc00;display:inline-block"></span>
        Checklist
      </h1>

      <div class="stats" id="stats">
        <div class="stat"><div class="v" id="statCollected">0</div><div class="k">Collected</div></div>
        <div class="stat"><div class="v" id="statTotal">0</div><div class="k">Total</div></div>
        <div class="stat"><div class="v" id="statPercent">0%</div><div class="k">Complete</div></div>
        <div class="stat"><div class="v" id="statRemaining">0</div><div class="k">Remaining</div></div>
      </div>

      <!-- BINDER VIEW -->
      <div class="binder" id="binder">
        <div class="binder-head">
          <div class="title">Binder View</div>
          <div class="binder-nav">
            <div class="nav-arrows">
              <button id="binderPrev">◀ Prev</button>
              <button id="binderNext">Next ▶</button>
            </div>
            <span id="binderPageLabel" class="muted">Page 1 / 1</span>
            <div class="nav-jump">
              <input id="binderJump" type="number" min="1" value="1" aria-label="Jump to page">
              <button id="binderGo">Go</button>
            </div>
          </div>
        </div>
        <div id="binderGrid" class="binder-grid"></div>
      </div>

      <div class="toolbar">
        <input id="searchList" class="grow" type="text" placeholder="Search name or number..." />
        <div class="controls">
          <span id="progress" class="pill">0 / 0</span>
          <div class="filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="unchecked">Unchecked</button>
            <button data-filter="checked">Checked</button>
          </div>
        </div>
      </div>

      <div id="list" class="list" aria-live="polite"></div>

      <div class="row" style="margin-top:.75rem;">
        <button id="markAll">Mark All</button>
        <button id="clearAll">Clear All</button>
        <button id="exportBtn">Export</button>
        <input id="importFile" type="file" accept="application/json" style="display:none" />
        <button id="importBtn">Import</button>
      </div>
      <small class="muted">Progress saves automatically to this device (localStorage).</small>
    </section>
  </main>

  <script>
    // --- Tab switching ---
    const tabBtns=document.querySelectorAll('.tab-btn');
    const tabs=document.querySelectorAll('[data-tab]');
    tabBtns.forEach(btn=>{
      btn.addEventListener('click',()=>{
        tabBtns.forEach(b=>b.classList.remove('active'));
        tabs.forEach(t=>t.classList.remove('active'));
        btn.classList.add('active');
        document.querySelector(btn.dataset.open).classList.add('active');
      });
    });

    // --- Finder elements ---
    const out=document.getElementById('out');
    const numInput=document.getElementById('pokeNum');
    const picker=document.getElementById('pokePicker');
    const dataList=document.getElementById('pokeList');
    const finderHint=document.getElementById('finderHint');
    const selectedNameEl=document.getElementById('selectedName');
    const collectedToggle=document.getElementById('collectedToggle');
    const finderSpriteBox=document.getElementById('finderSprite');

    // --- Checklist / Binder elements ---
    const listEl=document.getElementById('list');
    const searchList=document.getElementById('searchList');
    const progressEl=document.getElementById('progress');
    const filterButtons=document.querySelectorAll('.filters button');
    const statCollected=document.getElementById('statCollected');
    const statTotal=document.getElementById('statTotal');
    const statPercent=document.getElementById('statPercent');
    const statRemaining=document.getElementById('statRemaining');

    // Binder view
    const binderGrid=document.getElementById('binderGrid');
    const binderPrev=document.getElementById('binderPrev');
    const binderNext=document.getElementById('binderNext');
    const binderPageLabel=document.getElementById('binderPageLabel');
    const binderJump=document.getElementById('binderJump');
    const binderGo=document.getElementById('binderGo');
    let binderPage=1, binderTotalPages=1;

    // --- State ---
    const STORAGE_KEY='binderChecked_v1';
    const dexMap=new Map();          // { "001" => "Bulbasaur", ... }
    let checkedState=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
    const padNum=n=>String(n).padStart(3,'0');
    function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(checkedState));updateProgress();}

    // --- Sprite URLs (+ fallback) ---
    function spriteOfficial(num){
      const n=parseInt(num,10);
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${n}.png`;
    }
    function spriteClassic(num){
      const n=parseInt(num,10);
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${n}.png`;
    }
    function makeSpriteImg(num, alt){
      const img=new Image();
      img.loading='lazy';
      img.alt=alt||'sprite';
      img.src=spriteOfficial(num);
      img.dataset.fallback='0';
      img.onerror=function(){
        if(img.dataset.fallback==='0'){
          img.src=spriteClassic(num);
          img.dataset.fallback='1';
        }
      };
      return img;
    }

    // --- Finder logic ---
    function compute(){
      const n=parseInt(numInput.value,10);
      if(!n||n<1){out.textContent='Enter a valid positive number.';syncFinderUI(null);return;}
      const page=Math.floor((n-1)/16)+1;
      const slot=((n-1)%16)+1;
      out.textContent=`Page: ${page} • Slot: ${slot}`;
      syncFinderUI(padNum(n));
      // Also move binder to that page for convenience
      setBinderPage(page);
    }
    document.getElementById('calc').addEventListener('click',compute);

    function syncFinderUI(id){
      if(!id||!dexMap.has(id)){
        selectedNameEl.textContent='';
        collectedToggle.disabled=true;
        collectedToggle.checked=false;
        finderSpriteBox.innerHTML='';
        return;
      }
      const name=dexMap.get(id);
      selectedNameEl.textContent=`${id} — ${name}`;
      collectedToggle.disabled=false;
      collectedToggle.checked=!!checkedState[id];

      finderSpriteBox.innerHTML='';
      const img=makeSpriteImg(id, `${name} artwork`);
      finderSpriteBox.appendChild(img);
    }

    picker.addEventListener('change',()=>{
      const m=picker.value.match(/^\s*(\d{1,4})/);
      if(m){
        const n=parseInt(m[1],10);
        if(Number.isFinite(n)&&n>0){numInput.value=String(n);compute();}
      }
    });

    collectedToggle.addEventListener('change',()=>{
      const n=parseInt(numInput.value,10);
      if(!n||n<1)return;
      const id=padNum(n);
      if(!dexMap.has(id))return;
      checkedState[id]=collectedToggle.checked;
      saveState();
      renderList();        // reflect in the checklist
      renderBinderGrid();  // reflect highlight in binder
    });

    // --- Load pokemon.txt ---
    fetch('pokemon.txt')
      .then(r=>{ if(!r.ok) throw new Error('pokemon.txt not found'); return r.text(); })
      .then(text=>{
        let maxId=0;
        text.split(/\r?\n/).forEach(raw=>{
          const line=raw.trim();
          if(!line||/^number\s*,\s*name/i.test(line)) return;      // skip header/blank
          const [numRaw,nameRaw]=line.split(',');
          if(!numRaw||!nameRaw) return;
          const num=numRaw.trim(), name=nameRaw.trim();
          if(!/^\d+$/.test(num)) return;
          dexMap.set(num,name);
          const val=parseInt(num,10); if(val>maxId) maxId=val;
        });
        binderTotalPages=Math.max(1, Math.ceil(maxId/16));
        populateDatalist();
        renderList();
        updateProgress();
        setBinderPage(1); // initial render
        const n=parseInt(numInput.value,10);
        if(n>0) syncFinderUI(padNum(n));
      })
      .catch(err=>{
        console.warn(err);
        finderHint.style.display='block';
        finderHint.textContent='pokemon.txt could not be loaded. On GitHub Pages it will load if placed next to index.html.';
      });

    function populateDatalist(){
      dataList.innerHTML='';
      for(const [num,name] of dexMap){
        const opt=document.createElement('option');
        opt.value=`${num} — ${name}`;
        dataList.appendChild(opt);
      }
    }

    // --- Binder view ---
    function setBinderPage(p){
      binderPage=Math.max(1, Math.min(binderTotalPages, p));
      binderPageLabel.textContent=`Page ${binderPage} / ${binderTotalPages}`;
      if (binderJump) {
        binderJump.max = String(binderTotalPages);
        binderJump.value = String(binderPage);
      }
      renderBinderGrid();
    }
    binderPrev.addEventListener('click',()=> setBinderPage(binderPage-1));
    binderNext.addEventListener('click',()=> setBinderPage(binderPage+1));
    binderGo.addEventListener('click', ()=>{
      const v=parseInt(binderJump.value,10);
      if(Number.isFinite(v)) setBinderPage(v);
    });
    binderJump.addEventListener('keydown', (e)=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const v=parseInt(binderJump.value,10);
        if(Number.isFinite(v)) setBinderPage(v);
      }
    });

    function renderBinderGrid(){
      binderGrid.innerHTML='';
      // 16 slots per page, 4x4; global index is 1-based
      for(let i=0;i<16;i++){
        const globalIndex=(binderPage-1)*16 + (i+1);
        const num=padNum(globalIndex);
        const cell=document.createElement('div');
        cell.className='binder-cell';

        // green highlight if collected
        if (checkedState[num]) cell.classList.add('checked');

        const slotNote=document.createElement('div');
        slotNote.className='slot';
        slotNote.textContent=`Slot ${((globalIndex-1)%16)+1}`;

        const name=dexMap.get(num);
        if(name){
          const img=makeSpriteImg(num, name);
          const label=document.createElement('div');
          label.className='title';
          label.textContent=`${num} ${name}`;
          cell.append(img, label, slotNote);
        }else{
          const empty=document.createElement('div');
          empty.className='binder-empty';
          empty.textContent='(empty)';
          cell.append(empty, slotNote);
        }

        // tap a cell to jump Finder to that card (if present)
        cell.addEventListener('click', ()=>{
          if(dexMap.has(num)){
            numInput.value=String(globalIndex);
            compute();
          }
        });

        binderGrid.appendChild(cell);
      }
    }

    // --- Checklist rendering ---
    let currentFilter='all';
    filterButtons.forEach(btn=>{
      btn.addEventListener('click',()=>{
        filterButtons.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter=btn.dataset.filter;
        renderList();
      });
    });

    searchList.addEventListener('input',()=>renderList());

    function updateProgress(){
      const total=dexMap.size;
      let checked=0;
      for(const num of dexMap.keys()) if(checkedState[num]) checked++;
      const remaining=total-checked;
      const pct=total?Math.round((checked/total)*100):0;

      progressEl.textContent=`${checked} / ${total}`;
      statCollected.textContent=checked;
      statTotal.textContent=total;
      statPercent.textContent=`${pct}%`;
      statRemaining.textContent=remaining;
    }

    function passesFilter(num){
      const isChecked=!!checkedState[num];
      if(currentFilter==='checked') return isChecked;
      if(currentFilter==='unchecked') return !isChecked;
      return true; // all
    }

    function renderList(){
      const q=searchList.value.trim().toLowerCase();
      const frag=document.createDocumentFragment();
      listEl.innerHTML='';

      for(const [num,name] of dexMap){
        const hay=(num+' '+name).toLowerCase();
        if(q && !hay.includes(q)) continue;
        if(!passesFilter(num)) continue;

        const row=document.createElement('div');
        row.className='row-item';
        row.dataset.num=num;

        const cb=document.createElement('input');
        cb.type='checkbox';
        cb.checked=!!checkedState[num];
        cb.addEventListener('change',()=>{
          checkedState[num]=cb.checked;
          saveState();
          nameEl.classList.toggle('strike',cb.checked);
          const cur=parseInt(numInput.value,10);
          if(cur>0 && padNum(cur)===num) collectedToggle.checked=cb.checked;
        });

        // mini sprite next to each list row
        const icon=document.createElement('img');
        icon.className='icon-sprite';
        icon.alt=`${name} sprite`;
        icon.loading='lazy';
        icon.src=spriteOfficial(num);
        icon.dataset.fallback='0';
        icon.onerror=function(){
          if(icon.dataset.fallback==='0'){ icon.src=spriteClassic(num); icon.dataset.fallback='1'; }
        };

        const numEl=document.createElement('div');
        numEl.className='num';
        numEl.textContent=num;

        const nameEl=document.createElement('div');
        nameEl.className='name';
        nameEl.textContent=name;
        nameEl.classList.toggle('strike',cb.checked);

        // tap anywhere on the row to toggle
        row.addEventListener('click',(e)=>{
          if(e.target.tagName.toLowerCase()==='input') return;
          cb.checked=!cb.checked;
          checkedState[num]=cb.checked;
          nameEl.classList.toggle('strike',cb.checked);
          saveState();
          const cur=parseInt(numInput.value,10);
          if(cur>0 && padNum(cur)===num) collectedToggle.checked=cb.checked;
        });

        row.append(cb, icon, numEl, nameEl);
        frag.appendChild(row);
      }

      listEl.appendChild(frag);
      updateProgress();
    }

    // --- Bulk actions + import/export ---
    document.getElementById('markAll').addEventListener('click',()=>{
      for(const num of dexMap.keys()) checkedState[num]=true;
      saveState(); renderList(); renderBinderGrid();
    });

    document.getElementById('clearAll').addEventListener('click',()=>{
      checkedState={};
      saveState(); renderList(); renderBinderGrid();
    });

    document.getElementById('exportBtn').addEventListener('click',()=>{
      const blob=new Blob([JSON.stringify(checkedState,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='binder-progress.json';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });

    const importFile=document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click',()=>importFile.click());
    importFile.addEventListener('change',(e)=>{
      const file=e.target.files?.[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const obj=JSON.parse(String(reader.result));
          if(obj && typeof obj==='object'){
            checkedState=obj;
            saveState(); renderList(); renderBinderGrid();
            const n=parseInt(numInput.value,10);
            if(n>0) syncFinderUI(padNum(n));
          }
        }catch{ alert('Invalid JSON'); }
      };
      reader.readAsText(file);
      importFile.value='';
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Binder Slots">

  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <title>Binder Slot Finder</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 1rem; }
    .card { max-width: 560px; margin: 0 auto; padding: 1rem; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.07); }
    label,input,button { font-size: 1.1rem; }
    input { width: 100%; padding: .6rem .8rem; margin:.5rem 0 1rem; border-radius: 10px; border: 1px solid #ddd; }
    button { padding:.7rem 1rem; border:0; border-radius: 12px; cursor:pointer; }
    .row { display:flex; gap:.75rem; }
    .row > * { flex:1; }
    .out { margin-top: 1rem; font-weight: 600; }
    small.muted { color:#666 }
  </style>
</head>
<body>
  <div class="card">
    <h1>Binder Slot Finder</h1>
    <p>Each side has 16 slots. Enter a number or pick a Pokémon:</p>

    <label for="pokePicker">Search Pokémon</label>
    <input id="pokePicker" list="pokeList" placeholder="e.g. 001 — Bulbasaur" autocomplete="off" />
    <datalist id="pokeList"></datalist>
    <small class="muted">Format in <code>pokemon.txt</code>: <code>Number,Name</code> (e.g., <code>001,Bulbasaur</code>)</small>

    <label for="pokeNum">Card #</label>
    <input id="pokeNum" type="number" min="1" inputmode="numeric" placeholder="e.g. 67" />

    <div class="row">
      <button id="calc">Find Slot</button>
      <button id="install" style="-webkit-appearance:none">Add to Home Screen</button>
    </div>

    <div class="out" id="out"></div>
  </div>

  <script>
    const out = document.getElementById('out');
    const numInput = document.getElementById('pokeNum');
    const picker = document.getElementById('pokePicker');
    const list = document.getElementById('pokeList');

    // Map like: { "001": "Bulbasaur", ... }
    const dexMap = new Map();

    // Load pokemon.txt (must be in same directory or adjust path)
    fetch('pokemon.txt')
      .then(r => {
        if (!r.ok) throw new Error('pokemon.txt not found');
        return r.text();
      })
      .then(text => {
        text.split(/\r?\n/).forEach(line => {
          line = line.trim();
          if (!line || /^number\s*,\s*name/i.test(line)) return; // skip header/blank
          const [numRaw, nameRaw] = line.split(',');
          if (!numRaw || !nameRaw) return;
          const num = numRaw.trim();
          const name = nameRaw.trim();
          dexMap.set(num, name);

          // For datalist, show "001 — Bulbasaur" but value must be searchable
          const opt = document.createElement('option');
          opt.value = `${num} — ${name}`;
          list.appendChild(opt);
        });
      })
      .catch(err => {
        console.warn(err);
        // Soft hint for local-file viewing; will work on GitHub Pages
        const warn = document.createElement('div');
        warn.className = 'out';
        warn.textContent = 'Tip: pokemon.txt could not be loaded here. It will load when hosted (e.g., GitHub Pages).';
        document.querySelector('.card').appendChild(warn);
      });

    // When user chooses from the datalist, extract the leading number
    picker.addEventListener('change', () => {
      const m = picker.value.match(/^\s*(\d{1,4})/); // allow up to 4 digits for later gens
      if (m) {
        const n = parseInt(m[1], 10);
        if (Number.isFinite(n) && n > 0) {
          numInput.value = String(n);
          compute();
        }
      }
    });

    // Core math: each side has 16 slots; pages are 1-based
    function compute() {
      const n = parseInt(numInput.value, 10);
      if (!n || n < 1) { out.textContent = 'Enter a valid positive number.'; return; }

      const page = Math.floor((n - 1) / 16) + 1;
      const slot = ((n - 1) % 16) + 1;

      out.textContent = `Page: ${page} • Slot: ${slot}`;
    }

    document.getElementById('calc').addEventListener('click', compute);

    // iOS Add to Home Screen hint (manual; iOS requires user action)
    document.getElementById('install').addEventListener('click', () => {
      alert('On iOS: tap the Share icon → “Add to Home Screen”.');
    });
  </script>
</body>
</html>
